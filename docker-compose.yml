services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector-db
    restart: always
    shm_size: 4gb
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: vectordb
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
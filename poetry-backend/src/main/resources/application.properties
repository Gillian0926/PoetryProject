server.port=8080

# 数据库连接
spring.datasource.url=jdbc:postgresql://localhost:5432/vectordb
spring.datasource.username=pguser
spring.datasource.password=pgpass
spring.datasource.driver-class-name=org.postgresql.Driver

# 强制处理中文编码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# JPA 配置
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

# Spring AI Alibaba 配置
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY}
spring.ai.dashscope.chat.options.model=qwen-plus

# ================= AI 超时设置 (单位: 毫秒) =================
# 连接超时: 10秒 -> 10000
spring.ai.dashscope.connection-timeout=10000
# 读取超时: 120秒 -> 120000 (给 AI 写作文留足时间)
spring.ai.dashscope.read-timeout=120000

# 嵌入模型超时
spring.ai.dashscope.embedding.options.connect-timeout=10000
spring.ai.dashscope.embedding.options.read-timeout=60000